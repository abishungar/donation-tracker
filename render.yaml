databases:
  - name: donation-tracker-db
    plan: free
    databaseName: donation_tracker
    user: donation_tracker

services:
  - type: web
    name: donation-tracker
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build && npx prisma migrate deploy --schema=server/prisma/schema.prisma && npm run seed -w server
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        fromDatabase:
          name: donation-tracker-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false

      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        sync: false
      - key: SMTP_APP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
