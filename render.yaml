databases:
  - name: donation-tracker-db
    plan: free
    databaseName: donation_tracker
    user: donation_tracker

services:
  - type: web
    name: donation-tracker
    runtime: node
    plan: free
    buildCommand: npm install && npm run build && npx prisma migrate deploy --schema=server/prisma/schema.prisma
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        fromDatabase:
          name: donation-tracker-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
